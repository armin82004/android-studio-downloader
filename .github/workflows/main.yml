name: Android Studio Release

on:
  schedule:
    # Every day at 04:00 UTC
    - cron: "0 4 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Get latest Android Studio version
        id: android-studio
        shell: bash
        run: |
          set -euo pipefail

          PAGE="$(curl -fsSL \
            -H "User-Agent: Mozilla/5.0" \
            "https://developer.android.com/studio")"

          # Find the Linux archive
          DOWNLOAD_URL="$(
            printf '%s' "$PAGE" |
            grep -oE 'https://[^"]+android-studio-[^"]+-linux\.tar\.gz' |
            head -n 1
          )"

          # Fallback: extract the filename and construct the Google URL
          if [ -z "$DOWNLOAD_URL" ]; then
            FILE_NAME="$(
              printf '%s' "$PAGE" |
              grep -oE 'android-studio-[a-z0-9]+(-patch[0-9]+)?-linux\.tar\.gz' |
              head -n 1
            )"

            if [ -z "$FILE_NAME" ]; then
              echo "Could not find Android Studio Linux archive."
              exit 1
            fi

            DOWNLOAD_URL="https://redirector.gvt1.com/edgedl/android/studio/$(date +%Y.%m)/$FILE_NAME"
          fi

          FILE_NAME="$(basename "$DOWNLOAD_URL")"

          # Extract the version from Google's page
          VERSION="$(
            printf '%s' "$PAGE" |
            grep -oE 'Android Studio [A-Za-z]+ [0-9]+ \| [0-9]+\.[0-9]+\.[0-9]+' |
            head -n 1 |
            grep -oE '[0-9]+\.[0-9]+\.[0-9]+' |
            head -n 1
          )"

          if [ -z "$VERSION" ]; then
            echo "Could not determine Android Studio version."
            exit 1
          fi

          echo "Latest version: $VERSION"
          echo "Download URL: $DOWNLOAD_URL"
          echo "Filename: $FILE_NAME"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "url=$DOWNLOAD_URL" >> "$GITHUB_OUTPUT"
          echo "filename=$FILE_NAME" >> "$GITHUB_OUTPUT"

      - name: Check existing release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.android-studio.outputs.version }}
        run: |
          TAG="android-studio-$VERSION"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release $TAG already exists."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Release $TAG does not exist."
          fi

      - name: Download Android Studio
        if: steps.release.outputs.exists == 'false'
        env:
          URL: ${{ steps.android-studio.outputs.url }}
          FILE: ${{ steps.android-studio.outputs.filename }}
        run: |
          set -euo pipefail

          echo "Downloading $FILE..."

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-delay 5 \
            --output "$FILE" \
            "$URL"

          echo "Download completed."

      - name: Calculate SHA256
        if: steps.release.outputs.exists == 'false'
        id: checksum
        env:
          FILE: ${{ steps.android-studio.outputs.filename }}
        run: |
          SHA256="$(sha256sum "$FILE" | cut -d' ' -f1)"

          echo "SHA256: $SHA256"

          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: steps.release.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.android-studio.outputs.version }}
          FILE: ${{ steps.android-studio.outputs.filename }}
          SHA256: ${{ steps.checksum.outputs.sha256 }}
        run: |
          TAG="android-studio-$VERSION"

          gh release create "$TAG" \
            "$FILE" \
            --title "Android Studio $VERSION" \
            --notes "Android Studio $VERSION

          Automatically downloaded from Google.

          Official source:
          https://developer.android.com/studio

          SHA-256:
          $SHA256" \
            --latest

          echo "Release created: $TAG"
